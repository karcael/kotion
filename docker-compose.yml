services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kotion
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-kotion}"
      POSTGRES_DB: kotion
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotion"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://kotion:${POSTGRES_PASSWORD:-kotion}@postgres:5432/kotion"
      # JWT_SECRET is required; startup fails if it is not set (no insecure default).
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      UPLOAD_DIR: "/app/data/uploads"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to ::1 first,
      # while the server binds to 0.0.0.0 (IPv4 only), so the probe would be
      # refused and report a healthy app as unhealthy.
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    volumes:
      - uploads:/app/data/uploads

volumes:
  postgres-data:
  uploads:
